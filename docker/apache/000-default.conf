<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/apps/api/public

    <Directory /var/www/html/apps/api/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
