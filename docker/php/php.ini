; Ustawienia PHP wspólne dla Dockera i dla wbudowanego serwera deweloperskiego
; (`php -c docker/php/php.ini -S ...`), żeby oba zachowywały się tak samo.

; Zdjęcia z telefonu mają rutynowo 10-15 MB, a domyślny PHP przyjmuje 2 MB
; i odrzuca żądanie przed wejściem do kodu, więc panel nie mógł pokazać
; sensownego błędu. post_max_size musi być większy od upload_max_filesize,
; bo obejmuje też pozostałe pola formularza.
upload_max_filesize = 32M
post_max_size = 36M
memory_limit = 256M

; Odpowiedź modelu może potrwać dłużej niż domyślne 30 sekund. Limit PHP musi
; być wyższy niż timeout cURL, aby API mogło zwrócić kontrolowany JSON zamiast
; urwać połączenie bez odpowiedzi.
max_execution_time = 60
hard_timeout = 5

; API zwraca JSON, więc ostrzeżenia nie mogą trafiać do treści odpowiedzi:
; wypisane przed nagłówkami psują status, CORS i samo parsowanie odpowiedzi.
; Trafiają do logu błędów SAPI, czyli na stderr serwera deweloperskiego
; i do logu Apache w kontenerze.
display_errors = Off
log_errors = On
